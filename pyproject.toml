[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-codex-bridge"
version = "0.3.0a19"
description = "Personal Windows Slack remote control for a verified Codex desktop instance"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alfred Zhang", email = "alfred.zhanghao@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = ["slack-sdk>=3,<4", "aiohttp>=3.12,<4"]

[project.scripts]
bridge = "slack_codex_bridge.cli:main"

[project.gui-scripts]
bridge-background = "slack_codex_bridge.cli:main"
bridge-supervisor = "slack_codex_bridge.supervisor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["desktop_host: positive detached lifecycle gate requiring a Windows host that permits job breakaway"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
