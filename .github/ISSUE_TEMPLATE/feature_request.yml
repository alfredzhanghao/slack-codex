name: 💡 功能与改进建议 (Feature Request)
description: 为 Slack Codex Bridge 提出新的功能点或体验优化建议
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 对应痛点或场景
      description: 目前的哪些局限让你产生了这一需求？
      placeholder: 例如：当返回的文件超过 2 个时...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望这个功能如何工作，或者有哪些交互建议？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充说明
      description: 是否有现存的临时解决方案或类似的参考项目？
